# Optuna Hyperparameter Optimization - Base Configuration
# This config provides the structure and fixed parameters for HPO.
# Hyperparameters marked with SEARCH will be optimized by Optuna.

# Trainer settings (fixed)
trainer:
  accelerator: "gpu"
  fast_dev_run: false
  max_epochs: 10
  logger: true
  enable_checkpointing: true

# Model configuration
# Note: SEARCH parameters will be overridden by Optuna
model:
  class_path: forestvision.trainers.litunet.MultiTaskUNet
  init_args:
    # Fixed architecture parameters
    in_channels: 14  # 10 S2 bands + 1 elevation + 3 climate variables
    num_seg_classes: 14  # fortypba with 13 forest types + NF
    num_reg_targets: 3   # cancov, qmd_dom, ba_ge_3
    loss: "focal"
    ignore_index: -1
    # SEARCH: labels and colormap (fixed for this task)
    labels:
      0: NF
      1: shr
      2: rip
      3: lpp
      4: pdp
      5: mxc
      6: wju
      7: mxo
      8: asp
      9: mxh
      10: red
      11: dfi
      12: sfi
      13: spr
    colormap:
      0: "#ffffff"  
      1: "#1f77b4"
      2: "#ff7f0e"
      3: "#2ca02c"
      4: "#d62728"
      5: "#9467bd"
      6: "#8c564b"
      7: "#e377c2"
      8: "#7f7f7f"
      9: "#bcbd22"
      10: "#17becf"
      11: "#aec7e8"
      12: "#ffbb78"
      13: "#98df8a"
    # SEARCH parameters (will be optimized):
    # lr: 0.0001  # Range: [1e-5, 1e-2] (log scale)
    # dropout: 0.5  # Range: [0.1, 0.7]
    # seg_loss_weight: 0.6  # Range: [0.3, 0.8]
    # weight_decay: 0.0001  # Range: [1e-6, 1e-2] (log scale)
    # scheduler_patience: 3  # Range: [2, 10] (integer)
    # scheduler_factor: 0.5  # Range: [0.1, 0.8]
    # focal_alpha: 0.25  # Range: [0.1, 1.0]
    # focal_gamma: 2.0  # Range: [1.0, 5.0]

# Data configuration
data:
  class_path: forestvision.datamodules.ForTypesDataModule
  init_args:
    root: data/
    year: 2021
    patch_size: 32
    stats_path: dev/train_test_120p10m_stats.json
    train_tiles_path: dev/tiles/train_test_120p10m.geojson
    val_tiles_path: dev/tiles/val_test_120p10m.geojson
    test_tiles_path: dev/tiles/test_64p30m.geojson
    num_workers: 10
    # SEARCH: batch_size  # Range: [16, 24, 32, 36, 48, 64] (categorical)
    # Fixed input datasets
    input_datasets:
      - dataset_class: forestvision.datasets.GEESentinel2
        path_template: "datasets/geesentinel2/{year}/leafon"
        bands: ["B2", "B3", "B4", "B5", "B6", "B7", "B8", "B8A", "B11", "B12"]
        kwargs: 
          season: "leafon"
          res: 10
      - dataset_class: forestvision.datasets.GEE3Dep
        path_template: "datasets/gee3dep/{year}"
        bands: 
          - elevation
      - dataset_class: forestvision.datamodules.fortypbadatamodule.ClimateNA
        path_template: "datasets/climatena"
        bands: 
          - AHM
          - MAP
          - TD
        kwargs: 
          glob: "*.tif"
          res: 10
          is_image: true
          nodata: -9999
    # Fixed target datasets
    target_datasets:
      - dataset_class: forestvision.datasets.GNNForestAttr
        path_template: "datasets/gnn/{year}"
        bands: 
          - fortypba
          - cancov
          - qmd_dom
          - ba_ge_3
        kwargs:
          remap: true
          res: 10
    # Fixed transforms
    input_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "image"
    target_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "mask"
              identity_channels: [0]
              nodata: -1
