# Multitask UNet Model - Version 0
# MultiTaskUNet with 14-channel fusion inputs (Sentinel-2, elevation, climate) 
# predicting 14 forest types and 3 structural attributes, using Focal+L1 loss 
# with Adam optimizer and ReduceLROnPlateau scheduling.

trainer:
  accelerator: "gpu"
  fast_dev_run: false
  max_epochs: 30
  logger: true

model:
  class_path: forestvision.trainers.litunet.MultiTaskUNet
  init_args:
    in_channels: 14  # 10 S2 bands + 1 elevation + 3 climate variables
    num_seg_classes: 14  # fortypba with 13 forest types + NF
    num_reg_targets: 3   # cancov, qmd_dom, ba_ge_3
    loss: "focal"
    lr: 0.000233
    weight_decay: 0.000114
    ignore_index: -1
    dropout: 0.571
    scheduler_patience: 7
    scheduler_factor: 0.1325
    seg_loss_weight: 0.4
    labels:
      0: NF
      1: shr
      2: rip
      3: lpp
      4: pdp
      5: mxc
      6: wju
      7: mxo
      8: asp
      9: mxh
      10: red
      11: dfi
      12: sfi
      13: spr
    colormap:
      0: "#ffffff"  
      1: "#1f77b4"
      2: "#ff7f0e"
      3: "#2ca02c"
      4: "#d62728"
      5: "#9467bd"
      6: "#8c564b"
      7: "#e377c2"
      8: "#7f7f7f"
      9: "#bcbd22"
      10: "#17becf"
      11: "#aec7e8"
      12: "#ffbb78"
      13: "#98df8a"

data:
  class_path: forestvision.datamodules.ForTypesDataModule
  init_args:
    root: data/
    year: 2021
    batch_size: 48
    patch_size: 32
    stats_path: dev/osugnn_v0_stats.json
    train_tiles_path: dev/tiles/train_test_120p10m.geojson
    val_tiles_path: dev/tiles/val_test_120p10m.geojson
    test_tiles_path: dev/tiles/test_64p30m.geojson
    num_workers: 10
    # Overriding default datasets with a subset for testing
    input_datasets:
      - dataset_class: forestvision.datasets.GEESentinel2
        path_template: "datasets/geesentinel2/{year}/leafon"
        bands: ["B2", "B3", "B4", "B5", "B6", "B7", "B8", "B8A", "B11", "B12"]
        kwargs: 
          season: "leafon"
          res: 10
      - dataset_class: forestvision.datasets.GEE3Dep
        path_template: "datasets/gee3dep/{year}"
        bands: 
          - elevation
      - dataset_class: forestvision.datamodules.fortypbadatamodule.ClimateNA
        path_template: "datasets/climatena"
        bands: 
          - AHM
          - MAP
          - TD
        kwargs: 
          glob: "*.tif"
          res: 10
          is_image: true
          nodata: -9999
    target_datasets:
      - dataset_class: forestvision.datasets.GNNForestAttr
        path_template: "datasets/gnn/{year}"
        bands: 
          - fortypba
          - cancov
          - qmd_dom
          - ba_ge_3
        kwargs:
          remap: true
          res: 10
    input_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "image"
              # Channels indices from full stack that should not be normalized.
              # identity_channels: [10, 11]
    target_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "mask"
              identity_channels: [0]
              nodata: -1

