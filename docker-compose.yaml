services:
  forestvision:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: forestvision:latest
    container_name: forestvision
    stdin_open: true
    tty: true
    ipc: host
    working_dir: /workspace
    volumes:
      # Project workspace
      - .:/workspace
      # For persistent configuration and credentials
      - home:/home/ubuntu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PYTHONUNBUFFERED=1
      # Pass through host environment variables for GEE
      - GEE_PROJECT_NAME=${GEE_PROJECT_NAME:-}
    command: >
      bash -c "pip install --no-deps -e . && /bin/bash"

volumes:
  home:
    driver: local
