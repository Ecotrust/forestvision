[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["forestvision*"]

[project]
name = "forestvision"
version = "0.1.0"
authors = [
    {name = "Yankuic Galvan", email = "yankuic@gmail.com"},
]
description = "Machine learning package for forest analysis from remote sensing data"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api",
    "geopandas",
    "kornia",
    "torch==2.9.0+cu130",
    "torchvision==0.24.0",
    "lightning",
    "torchgeo==0.7",
    "rasterio",
    "rio_cogeo",
    "scikit-learn",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "shapely>=2.0",
    "torchmetrics",
    "tqdm",
    "python-dotenv",
    "python-dateutil",
    "retry",
    "requests",
    "optuna>=3.6.0",
    "optuna-integration>=3.6.0",
    "pyyaml>=6.0",
    "scipy",
    "Pillow",
    "rtree",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]

[tool.setuptools.package-data]
"forestvision" = ["py.typed"]
"*" = ["*.yaml", "*.yml", "*.json", "*.geojson"]

[tool.ruff]
per-file-ignores = { "*.ipynb" = ["E703"] }

[project.urls]
Homepage = "https://github.com/ygalvan/forestvision"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
    "sphinx",
]
notebooks = [
    "jupyter",
    "geemap",
    "folium",
]

[tool.black]
line-length = 88
target-version = ['py312']
