# Test configuration for new DataModule architecture
trainer:
  accelerator: "gpu"
  fast_dev_run: false
  max_epochs: 30
  logger: true

model:
  class_path: forestvision.trainers.litunet.MultiTaskUNet
  init_args:
    in_channels: 11 # 5 S2 bands + 2 indices (NDVI, SAVI) + 1 elevation + 3 climate variables 
    # Explicit architecture parameters
    num_seg_classes: 15  # Segmentation classes (NF + Water + 13 forest types)
    num_reg_targets: 3   # Regression targets (0 - 3)
    loss: "focal"
    # lr: 0.004600216969734407
    # dropout: 0.21625512195259877
    # weight_decay: 2.2988074881141243e-05
    # scheduler_patience: 4
    # scheduler_factor: 0.11788464636738039
    # focal_alpha: 0.9274758030302558
    # focal_gamma: 3.609833765630662
    # reg_loss: sharploss
    # sharploss_alpha: 0.661701233740305
    # use_reg_tanh: False
    # init_log_vars: 0.5319290553835152
    # use_loss_normalization: True
    # loss_norm_momentum: 0.8717541653445785
    lr: 0.001980377349249981
    dropout: 0.500347366287181
    weight_decay: 5.656146765126758e-05
    scheduler_patience: 3
    scheduler_factor: 0.6059236710555266
    focal_alpha: 0.9903905684609642
    focal_gamma: 3.1543006944754373
    reg_loss: mae
    sharploss_alpha: 0.3309128418068148
    init_log_vars: 0.2010758351200626
    use_loss_normalization: True
    loss_norm_momentum: 0.989119701229876
    use_reg_tanh: false # Whether to apply tanh activation to regression outputs (to bound them within a range, e.g., for TD which is typically between 0 and 30)
    ignore_index: -2147483648
    labels:
      0: NF       # Non-forest
      1: shr      # Shrub
      2: rip      # Riparian
      3: lpp      # Lodgepole pine
      4: pdp      # Ponderosa pine
      5: mxc      # Mixed conifer
      6: wju      # Western juniper  
      7: mxo      # Mixed Oak - Conifer
      8: asp      # Quaking Aspen
      9: mxh      # Mixed Hardwood-Conifer
      10: red     # Coastal Spruce, Cedar or Redwood
      11: dfi     # Douglas-fir - Western Hemlock
      12: sfi     # Silver fir - Mountain Hemlock
      13: spr     # Spruce - Subalpine Fir
      14: wat     # Water (from DW)
    colormap:
      0: "#ffffff"  
      1: "#1f77b4"
      2: "#ff7f0e"
      3: "#2ca02c"
      4: "#d62728"
      5: "#9467bd"
      6: "#8c564b"
      7: "#e377c2"
      8: "#7f7f7f"
      9: "#bcbd22"
      10: "#17becf"
      11: "#aec7e8"
      12: "#ffbb78"
      13: "#98df8a"
      14: "#419BDF"  # Water blue (from DW colormap)

data:
  class_path: forestvision.datamodules.ForTypesDataModule
  init_args:
    root: data/
    year: 2021
    batch_size: 48
    patch_size: 120
    stats_path: dev/configs/gnn_v1/osugnn_v1_stats.json
    train_tiles_path: dev/tiles/train_test_120p10m.geojson
    val_tiles_path: dev/tiles/val_test_120p10m.geojson
    test_tiles_path: dev/tiles/test_64p30m.geojson
    num_workers: 19
    download: false  # Skip downloading
    # Overriding default datasets with a subset for testing
    input_datasets:
      - dataset_class: forestvision.datasets.GEESentinel2
        path_template: "datasets/geesentinel2/{year}/leafon"
        bands: ["B2", "B3", "B4", "B5", "B6", "B7", "B8", "B8A", "B11", "B12"]
        kwargs: 
          season: "leafon"
          res: 10
        transforms:
          class_path: torchvision.transforms.v2.Compose
          init_args:
            transforms:
              # Appends NDMI
              - class_path: forestvision.transforms.AppendNDVI
                init_args:
                  # Indices for NIR and Red bands in list passed to bands argument above 
                  index_nir: 6
                  index_red: 8
              - class_path: forestvision.transforms.AppendSAVI
                init_args:
                  # Indices for NIR and Red bands in list passed to bands argument above 
                  index_nir: 6
                  index_red: 2
                  L: 0.5
      - dataset_class: forestvision.datasets.GEE3Dep
        path_template: "datasets/gee3dep/{year}"
        bands: 
          - elevation
      - dataset_class: forestvision.datamodules.fortypbadatamodule.ClimateNA
        path_template: "datasets/climatena"
        bands: 
          - AHM
          - MAP
          - TD
        kwargs: 
          glob: "*.tif"
          res: 10
          is_image: true
          nodata: -9999
    target_datasets:
      - dataset_class: forestvision.datasets.GNNForestAttr
        path_template: "datasets/gnn/{year}"
        bands:
          - fortypba
          - cancov
          - qmd_dom
          - ba_ge_3
        kwargs:
          res: 10
          remap: true
        transforms:
          class_path: forestvision.transforms.CombineGNNDWMask
          init_args:
            dw_class: forestvision.datasets.GEEDynamicWorld
            dw_path: "data/datasets/geedw/2021"
            date_start: "2021-06-01"
            date_end: "2021-08-31"
            roi: [-2297985.0, -1541985.0, 2298015.0, 3174015.0]
    input_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.SelectBands
            init_args:
              # Indices from full stack: 10 s2 bands + 2 indices (NDVI, SAVI) + 1 elevation + 3 climate = 16 total channels
              indices: [0, 1, 2, 3, 9, 10, 11, 12, 13, 14, 15]
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "image"
              # Channels indices from image stack after SelectBands that should not be normalized.
              identity_channels: [5, 6] # NDMI and SAVI indices
    target_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "mask"
              identity_channels: [0]
              nodata: -2147483648
