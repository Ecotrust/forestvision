# Optuna Hyperparameter Optimization - OSUGNN v1 Configuration
# This config provides the structure and fixed parameters for HPO.
# Hyperparameters marked with SEARCH will be optimized by Optuna.
# Based on configs/osugnn_v1.yaml

# Trainer settings (fixed)
trainer:
  accelerator: "gpu"
  fast_dev_run: false
  max_epochs: 20
  logger: true
  enable_checkpointing: true

# Model configuration
# Note: SEARCH parameters will be overridden by Optuna
model:
  class_path: forestvision.trainers.litunet.MultiTaskUNet
  init_args:
    # Fixed architecture parameters
    in_channels: 15  # 10 S2 bands + 1 NDMI + 1 elevation + 3 climate variables
    num_seg_classes: 15  # Segmentation classes (NF + Water + 13 forest types)
    num_reg_targets: 3   # Regression targets (0 - 3)
    loss: "focal"
    ignore_index: -2147483648
    # Fixed labels and colormap
    labels:
      0: NF       # Non-forest
      1: shr      # Shrub
      2: rip      # Riparian
      3: lpp      # Lodgepole pine
      4: pdp      # Ponderosa pine
      5: mxc      # Mixed conifer
      6: wju      # Western juniper  
      7: mxo      # Mixed Oak - Conifer
      8: asp      # Quaking Aspen
      9: mxh      # Mixed Hardwood-Conifer
      10: red     # Coastal Spruce, Cedar or Redwood
      11: dfi     # Douglas-fir - Western Hemlock
      12: sfi     # Silver fir - Mountain Hemlock
      13: spr     # Spruce - Subalpine Fir
      14: wat     # Water (from DW)
    colormap:
      0: "#ffffff"  
      1: "#1f77b4"
      2: "#ff7f0e"
      3: "#2ca02c"
      4: "#d62728"
      5: "#9467bd"
      6: "#8c564b"
      7: "#e377c2"
      8: "#7f7f7f"
      9: "#bcbd22"
      10: "#17becf"
      11: "#aec7e8"
      12: "#ffbb78"
      13: "#98df8a"
      14: "#419BDF"  # Water blue (from DW colormap)
    # SEARCH parameters (will be optimized):
    # lr: 0.0001  # Range: [1e-5, 1e-2] (log scale)
    # dropout: 0.5  # Range: [0.1, 0.7]
    # weight_decay: 0.0001  # Range: [1e-6, 1e-2] (log scale)
    # scheduler_patience: 3  # Range: [2, 10] (integer)
    # scheduler_factor: 0.5  # Range: [0.1, 0.8]
    # focal_alpha: 0.25  # Range: [0.1, 1.0]
    # focal_gamma: 2.0  # Range: [1.0, 5.0]
    # Regression loss and uncertainty weighting parameters:
    # reg_loss: "mae"  # Categorical: ["mae", "sharploss"]
    # sharploss_alpha: 0.5  # Range: [0.0, 1.0] (active when reg_loss="sharploss")
    # use_uncertainty_weighting: true  # Categorical: [true, false]
    # init_log_vars: 0.0  # Range: [-1.0, 1.0]
    # use_loss_normalization: false  # Categorical: [true, false]
    # loss_norm_momentum: 0.9  # Range: [0.5, 0.99]

# Data configuration
data:
  class_path: forestvision.datamodules.ForTypesDataModule
  init_args:
    root: data/
    year: 2021
    patch_size: 120
    stats_path: dev/configs/optuna/optuna_osugnn_v1_stats.json
    train_tiles_path: dev/tiles/train_test_120p10m.geojson
    val_tiles_path: dev/tiles/val_test_120p10m.geojson
    test_tiles_path: dev/tiles/test_64p30m.geojson
    num_workers: 19
    download: false
    # SEARCH: batch_size  # Range: [16, 24, 32, 36, 48] (categorical)
    # Fixed input datasets with NDMI transform
    input_datasets:
      - dataset_class: forestvision.datasets.GEESentinel2
        path_template: "datasets/geesentinel2/{year}/leafon"
        bands: ["B2", "B3", "B4", "B5", "B6", "B7", "B8", "B8A", "B11", "B12"]
        kwargs: 
          season: "leafon"
          res: 10
        transforms:
          class_path: torchvision.transforms.v2.Compose
          init_args:
            transforms:
              # Appends NDMI
              - class_path: forestvision.transforms.AppendNDVI
                init_args:
                  # Indices for NIR and Red bands in list passed to bands argument above 
                  index_nir: 6
                  index_red: 8
      - dataset_class: forestvision.datasets.GEE3Dep
        path_template: "datasets/gee3dep/{year}"
        bands: 
          - elevation
      - dataset_class: forestvision.datamodules.fortypbadatamodule.ClimateNA
        path_template: "datasets/climatena"
        bands: 
          - AHM
          - MAP
          - TD
        kwargs: 
          glob: "*.tif"
          res: 10
          is_image: true
          nodata: -9999
    # Fixed target datasets
    target_datasets:
      - dataset_class: forestvision.datasets.GNNForestAttr
        path_template: "datasets/gnn/{year}"
        bands:
          - fortypba
          - cancov
          - qmd_dom
          - ba_ge_3
        kwargs:
          res: 10
          remap: true
        transforms:
          class_path: forestvision.transforms.CombineGNNDWMask
          init_args:
            dw_class: forestvision.datasets.GEEDynamicWorld
            dw_path: "data/datasets/geedw/2021"
            date_start: "2021-06-01"
            date_end: "2021-08-31"
            roi: [-2297985.0, -1541985.0, 2298015.0, 3174015.0]
    # Fixed transforms
    input_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "image"
              # Channels indices from full stack that should not be normalized.
              identity_channels: [10]
    target_transforms:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: forestvision.transforms.Normalize
            init_args:
              on_key: "mask"
              identity_channels: [0]
              nodata: -2147483648
